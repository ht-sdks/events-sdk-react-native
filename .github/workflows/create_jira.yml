name: Create Jira Ticket

on:
  issues:
    types:
      - opened

jobs:
  create_jira:
    name: Create Jira Ticket
    runs-on: ubuntu-latest
    environment: IssueTracker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login
        uses: atlassian/gajira-login@45fd029b9f1d6d8926c6f04175aa80c0e42c9026 # v3.0.1
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_TOKEN }}

      - name: Create
        id: create
        uses: atlassian/gajira-create@59e177c4f6451399df5b4911c2211104f171e669 # v3.0.1
        with:
          project: LIBMOBILE
          issuetype: Bug
          summary: |
            [${{ github.event.repository.name }}] (${{ github.event.issue.number }}): ${{ github.event.issue.title }}
          description: |
            Github Link: ${{ github.event.issue.html_url }}
            ${{ github.event.issue.body }}
          # Parent and Epic Link fields (set to same)
          fields: '{
            "parent": {"key": "LIBMOBILE-793"},
            "customfield_10002": "LIBMOBILE-793"
            }'

      - name: Log created issue
        run: echo "Issue ${{ steps.create.outputs.issue }} was created"
