name: Publish

on:
  workflow_dispatch:
    secrets:
      GITHUB_TOKEN:
        required: true
      NPM_TOKEN:
        required: true

jobs:
  publish:
    name: Publish to npm
    environment: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Workaround for corepack enable in node
      # Source: (https://github.com/actions/setup-node/issues/899#issuecomment-1828798029)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      # End workaround

      - name: Config and Build
        run: |
          npm config set //registry.npmjs.org/:_authToken ${NPM_TOKEN}
          yarn install --immutable
          yarn build
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (All)
        if: github.event.inputs.workspace == ''
        run: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The default branch ruleset requires pull requests, so semantic-release
      # no longer commits changelogs/version bumps to master directly (see
      # release.config.js). Instead, collect whatever the release generated and
      # open a PR with it.
      - name: Open release PR with changelogs and version bumps
        run: |
          CHANGED=$(git diff --name-only -- '*CHANGELOG.md' '*package.json')
          if [ -z "$CHANGED" ]; then
            echo "No changelog or version changes to PR."
            exit 0
          fi
          BRANCH="release/docs-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "$CHANGED" | xargs git add
          git commit -m "chore(release): changelogs and version bumps [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore(release): changelogs and version bumps" \
            --body "Auto-generated by the Publish workflow after a successful release. Contains the CHANGELOG.md updates and package.json version bumps for the versions just published. Merging keeps master's versions in sync with npm; the release itself is already complete (versions are derived from git tags)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
